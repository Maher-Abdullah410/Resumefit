name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:                       # required status check "backend"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resumefit
          POSTGRES_PASSWORD: resumefit
          POSTGRES_DB: resumefit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resumefit" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://resumefit:resumefit@localhost:5432/resumefit_test
      DATABASE_URL: postgresql+psycopg://resumefit:resumefit@localhost:5432/resumefit_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - name: Tests (fail under 70% coverage, NFR-25)
        run: pytest --cov=app --cov-fail-under=70

  frontend:                      # required status check "frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
