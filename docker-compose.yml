# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: resumefit
      POSTGRES_PASSWORD: resumefit
      POSTGRES_DB: resumefit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumefit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
